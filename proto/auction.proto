syntax = "proto3";

package auction;

service AuctionShardService {
    rpc CreateAuction (CreateAuctionRequest) returns (Auction);
    rpc GetAuction (GetAuctionRequest) returns (Auction);
    rpc PlaceBid (PlaceBidRequest) returns (BidResponse);
    rpc ListBids (ListBidsRequest) returns (BidListResponse);
    rpc ListAuctions (ListAuctionsRequest) returns (AuctionListResponse);
}

message Auction {
    string id = 1;
    string title = 2;
    string description = 3;
    string category = 4;
    double start_price = 5;
    double current_price = 6;
    string highest_bidder = 7;
    int64 start_time = 8;     // Unix timestamp in milliseconds
    int64 end_time = 9;       // Unix timestamp in milliseconds
    string status = 10;       // "ACTIVE", "ENDED", "CANCELLED", "UPCOMING"
    int32 shard_id = 11;
    int32 total_bids = 12;
    string image_url = 13;
}

message Bid {
    string id = 1;
    string auction_id = 2;
    string bidder = 3;
    double amount = 4;
    int64 timestamp = 5;      // Unix timestamp in milliseconds
    int32 shard_id = 6;
}

message CreateAuctionRequest {
    string title = 1;
    string description = 2;
    string category = 3;
    double start_price = 4;
    int64 duration_seconds = 5;
    int32 shard_id = 6;
    string image_url = 7;
}

message GetAuctionRequest {
    string auction_id = 1;
    int32 shard_id = 2;
}

message PlaceBidRequest {
    string auction_id = 1;
    string bidder = 2;
    double amount = 3;
    int32 shard_id = 4;
}

message BidResponse {
    bool success = 1;
    string message = 2;
    double current_price = 3;
    string highest_bidder = 4;
    int64 timestamp = 5;
    Auction updated_auction = 6;
}

message ListBidsRequest {
    string auction_id = 1;
    int32 limit = 2;
    int32 shard_id = 3;
}

message BidListResponse {
    repeated Bid bids = 1;
}

message ListAuctionsRequest {
    int32 shard_id = 1;
    string status = 2;
    int32 limit = 3;
}

message AuctionListResponse {
    repeated Auction auctions = 1;
}
